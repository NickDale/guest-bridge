[pytest]
# Async tesztek automatikus kezelése
asyncio_mode = auto

# Python path beállítása
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Kimenet formázás
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Marker regisztráció (figyelmeztetések elkerülése)
markers =
    asyncio: mark test as async
    slow: mark test as slow
    integration: mark test as integration test
    unit: mark test as unit test

# Test könyvtár
testpaths = tests

# Figyelmeztetések kezelése
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning