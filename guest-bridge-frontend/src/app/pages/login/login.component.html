<div class="container d-flex justify-content-center align-items-center min-vh-100 mt-4">
  <div class="w-100" style="max-width: 420px;">
    <div class="card shadow-sm p-4">
      <h1 class="h4 text-center mb-4">Bejelentkezés</h1>
      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Felhasználónév</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input [(ngModel)]="username" class="form-control" placeholder="Felhasználónév" name="username" required />
          </div>
        </div>
        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <label class="form-label">Jelszó</label>
          </div>

          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input [type]="passwordFieldType" [(ngModel)]="password" id="password" class="form-control"
              placeholder="Jelszó" name="password" required />
            <button type="button" class="input-group-text password-toggle" (click)="togglePasswordVisibility()">
              <i class="bi" [ngClass]="{ 
                  'bi-eye': passwordFieldType === 'password', 
                  'bi-eye-slash': passwordFieldType === 'text' 
                }" id="toggleIcon"></i>
            </button>
          </div>
          <a href="#" class="small">Elfelejtett jelszó?</a>
        </div>
        <button class="btn btn-primary w-100 mt-3" type="submit">
          Belépés
        </button>
      </form>
    </div>
  </div>
</div>
