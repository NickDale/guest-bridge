<form [formGroup]="passwordChangeForm" (ngSubmit)="onSubmit()">

    <div class="mb-3">
        <label class="form-label">Eredeti jelszó</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>

            <input [type]="origPasswordFieldType" 
                   formControlName="origPassword" 
                   id="origPassword" 
                   class="form-control" 
                   placeholder="Jelszó" 
                   required
                   [ngClass]="{'is-invalid': form['origPassword'].invalid && (form['origPassword'].dirty || form['origPassword'].touched)}" />

            <button type="button" class="input-group-text password-toggle" (click)="togglePasswordVisibility('orig')">
                <i class="bi"
                    [ngClass]="{ 'bi-eye': origPasswordFieldType === 'password', 'bi-eye-slash': origPasswordFieldType === 'text' }"></i>
            </button>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Új jelszó</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>

            <input [type]="newPasswordFieldType" 
                   formControlName="password" 
                   id="password" 
                   class="form-control" 
                   placeholder="Jelszó" 
                   required
                   [ngClass]="{'is-invalid': form['password'].invalid && (form['password'].dirty || form['password'].touched)}" />

            <button type="button" class="input-group-text password-toggle" (click)="togglePasswordVisibility('new')">
                <i class="bi"
                    [ngClass]="{ 'bi-eye': newPasswordFieldType === 'password', 'bi-eye-slash': newPasswordFieldType === 'text' }"></i>
            </button>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Jelszó megerősítése</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>

            <input [type]="confimPasswordFieldType" 
                   formControlName="confirmPassword" 
                   id="confirmPassword" 
                   class="form-control" 
                   placeholder="Jelszó megerősítése" 
                   required
                   [ngClass]="{'is-invalid': form['confirmPassword'].invalid && (form['confirmPassword'].dirty || form['confirmPassword'].touched)}" />

            <button type="button" class="input-group-text password-toggle" (click)="togglePasswordVisibility('confirm')">
                <i class="bi"
                    [ngClass]="{ 'bi-eye': confimPasswordFieldType === 'password', 'bi-eye-slash': confimPasswordFieldType === 'text' }"></i>
            </button>
        </div>
    </div>

    <button class="btn btn-primary w-100 mt-3" type="submit" [disabled]="passwordChangeForm.invalid">
        Belépés
    </button>
</form>
