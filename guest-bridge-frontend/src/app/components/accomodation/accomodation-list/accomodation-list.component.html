<div class="container mt-4">
    <div class="mb-3 d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center">
        <div
            class="d-flex flex-column flex-md-row align-items-start align-items-md-center w-100 w-md-auto mb-3 mb-md-0"> 
            <input type="text" class="form-control me-md-3" placeholder="Szűrés..." [(ngModel)]="searchText"
                (input)="applyFilter()" style="min-width: 250px;">
        </div>
        <div class="ms-md-auto">
            <button class="btn btn-outline-primary" title="Új szálláshely hozzáadása" (click)="openAccommodationModal()"
                data-bs-toggle="modal" data-bs-target="#accommodationRegistrationModal">
                <i class="bi bi-plus-lg"></i>
            </button>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
                <tr>
                    <th>Név</th>
                    <th>Státusz</th>
                    <th>Cím</th>
                    <th class="text-end">Részletek</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let accommodation of pagedAccomodations" (click)="openDetail(accommodation.id)"
                    style="cursor: pointer;">
                    <td>{{ accommodation.name }}</td>
                    <td>
                        <span [ngClass]="{
                            'text-success': accommodation.active,
                            'text-danger': !accommodation.active
                        }">
                            {{ accommodation.active ? '✔️ (Aktív)' : '❌ (Inaktív)' }}
                        </span>
                    </td>
                    <td style="max-width: 300px; white-space: normal;">{{ accommodation.address}}</td>
                    <td class="text-end">
                        <button class="btn btn-outline-primary btn-sm" title="Szálláshely részletei">
                            <i class="bi bi-eye"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div
        class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-3 mt-3">
        <div class="mb-2 mb-md-0">
            <label for="pageSizeSelect" class="me-2">Elemek száma oldalanként: </label>
            <select id="pageSizeSelect" class="form-select d-inline-block w-auto" [(ngModel)]="pageSize"
                (change)="changePage(1)">
                <option *ngFor="let size of [5, 10, 15]" [value]="size">{{ size }}</option>
            </select>
        </div>

        <div>
            <span>Rögzíttett szálláshelyek száma: <b>{{ filteredAccommodations.length }} db</b></span>
        </div>
    </div>

    <nav *ngIf="filteredAccommodations.length > pageSize">
        <ul class="pagination justify-content-center">
            <li class="page-item" [class.disabled]="currentPage === 1">
                <a class="page-link" (click)="changePage(currentPage - 1)" aria-label="Előző">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <li class="page-item" [class.active]="page === currentPage" *ngFor="let page of totalPages">
                <a class="page-link" (click)="changePage(page)">{{ page }}</a>
            </li>

            <li class="page-item" [class.disabled]="currentPage === totalPages.length">
                <a class="page-link" (click)="changePage(currentPage + 1)" aria-label="Következő">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>
</div>

<div class="modal fade" id="accommodationRegistrationModal" tabindex="-1"
    aria-labelledby="accommodationRegistrationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="accommodationRegistrationModalLabel">Új szálláshely rögzítése</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Bezárás"></button>
            </div>
            <div class="modal-body">
                <app-accomodation-registration-form (accommodationAdded)="refreshList()"
                    [selectedUserId]="selectedUserId">
                </app-accomodation-registration-form>
            </div>
        </div>
    </div>
</div>

<app-accomodation-detail *ngIf="selectedAccommodationId"
    [accommodationId]="selectedAccommodationId"></app-accomodation-detail>
