<div class="card my-2 p-3 shadow-sm room-card" 
     [class]="cardClass"
     [class.mapped]="isMapped"
     [class.unmapped-target]="source === 'vendegem' && !isMapped">

    <div class="d-flex justify-content-between align-items-center">
        <div>
            <strong class="text-truncate d-block">{{ room.name }}</strong>
         <!--   <span class="badge bg-secondary ms-0">{{ room.capacity }} fő</span>-->
            
            <div *ngIf="mappedFrom" class="text-success small mt-1">
                <i class="bi bi-link-45deg me-1"></i> Kapcsolva: 
                <span class="fw-bold text-dark">{{ mappedFrom.name }}</span>
            </div>
        </div>
        
        <div>
            <span *ngIf="isMapped" class="text-success fw-bold me-2">
                <i class="bi bi-check-circle-fill fs-5"></i>
            </span>
            
            <button *ngIf="source === 'szallas.hu' && !isMapped"
                    class="btn btn-sm btn-outline-primary"
                    (click)="performMapAction()"
                    title="Mappelés indítása">
                <i class="bi bi-arrow-right"></i> Mappelés
            </button>
            
            <span *ngIf="source === 'vendegem' && !isMapped"
                  class="text-muted small">
                  Várja a mappelést...
            </span>
        </div>
    </div>
